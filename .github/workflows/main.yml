name: Deploy GitHub Pages

# ====================================================================
# Authoritative GitHub Pages deployment workflow.
#
# This is the SINGLE workflow that publishes the public site. The
# previous duplicate (deploy.yml, "Deploy to GitHub Pages") has been
# removed: it omitted REPO_OWNER, which caused build-static.sh to
# treat the user-site repo as a project repo and emit a broken
# basePath of "/vincentritchie.github.io" (assets 404 → unstyled page).
# ====================================================================

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Safe concurrency: a second push must NOT cancel an active production
# deployment. New runs queue behind the current one so the published
# artifact is never left half-written.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Punctuation audit (no em dashes in authored text)
        run: python3 scripts/check-punctuation.py --src

      - name: Build static site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: bash scripts/build-static.sh

      - name: Verify static export output
        run: |
          set -euo pipefail
          echo "=== Structural checks on ./out ==="
          test -d out || { echo "❌ ./out does not exist: build failed"; exit 1; }
          test -f out/index.html || { echo "❌ out/index.html missing"; exit 1; }
          test -f out/.nojekyll || { echo "❌ out/.nojekyll missing"; exit 1; }
          test -d out/_next/static || { echo "❌ out/_next/static missing: JS/CSS not exported"; exit 1; }
          echo "✅ Structural checks passed"
          echo ""
          echo "=== Top-level out/ listing ==="
          ls -la out/ | head -40
          echo ""
          echo "=== _next/static tree (first level) ==="
          ls -la out/_next/static/ || true
          echo ""
          echo "=== Sample CSS/JS files ==="
          find out/_next/static -maxdepth 3 -type f \( -name '*.css' -o -name '*.js' \) | head -20

      - name: Verify HTML asset references resolve to real files
        run: |
          set -euo pipefail
          # For a user-site deployment BASE_PATH is empty, so every local
          # asset URL must be root-relative (e.g. /_next/static/...). For a
          # project site it is /<repo-name>/_next/static/...
          # This step parses index.html, extracts local asset URLs, and
          # confirms each one exists in the exported out/ directory. It also
          # fails the build if any reference contains the duplicated user-site
          # repo path (the original defect).
          python3 - <<'PY'
          import os, re, sys, html
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          out = Path("out")
          bad_prefix = "/vincentritchie.github.io/"

          html_files = []
          for root, _, files in os.walk(out):
              for f in files:
                  if f.endswith(".html"):
                      html_files.append(Path(root) / f)

          if not html_files:
              print("❌ no HTML files found in out/"); sys.exit(1)

          # Match href="/..." and src="/..." (and srcset candidates).
          attr_re = re.compile(r'(?:href|src|poster)\s*=\s*"([^"]+)"', re.I)
          missing = []
          bad_prefix_hits = []
          checked = 0
          for hf in html_files:
              text = hf.read_text(encoding="utf-8", errors="replace")
              for m in attr_re.finditer(text):
                  raw = html.unescape(m.group(1))
                  # Skip external, mailto, tel, data, anchor-only, protocol-relative.
                  if re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:', raw):  # scheme present (http, https, mailto, tel, data, blob)
                      continue
                  if raw.startswith("//"):
                      continue
                  if raw.startswith("#"):
                      continue
                  # Only root-relative local paths matter for resolution here.
                  if not raw.startswith("/"):
                      # Relative path: resolve against the html file location.
                      rel = (hf.parent / raw).resolve()
                      if not rel.exists():
                          missing.append(str(hf.relative_to(out)) + " -> " + raw)
                      checked += 1
                      continue
                  if raw.startswith(bad_prefix):
                      bad_prefix_hits.append(str(hf.relative_to(out)) + " -> " + raw)
                      continue
                  # Strip query/fragment, map URL path to out/ path.
                  path = urlsplit(raw).path
                  path = unquote(path)
                  if path == "/" or path == "":
                      continue
                  # _next/static/* lives at out/_next/static/*
                  target = out / path.lstrip("/")
                  if not target.exists():
                      missing.append(str(hf.relative_to(out)) + " -> " + raw)
                  checked += 1

          print(f"Checked {checked} local asset references across {len(html_files)} HTML files.")
          if bad_prefix_hits:
              print("❌ Found references using the broken duplicated prefix:")
              for h in bad_prefix_hits[:20]:
                  print("   " + h)
              sys.exit(1)
          if missing:
              print("❌ Missing asset files (referenced in HTML but not in out/):")
              for m in missing[:40]:
                  print("   " + m)
              sys.exit(1)
          print("✅ All local asset references resolve to real files in out/.")
          PY

      - name: Verify exported site has no em dashes in authored text
        run: python3 scripts/check-punctuation.py --out

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
